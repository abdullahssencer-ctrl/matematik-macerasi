<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Coach</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1f2937;--mut:#6b7280;--pri:#4f46e5;--pri2:#eef2ff;--ok:#059669;--bad:#dc2626;--line:#e5e7eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:max(12px,env(safe-area-inset-top)) 14px calc(76px + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto}
h1{font-size:24px;margin:6px 0 2px}h2{font-size:19px;margin:14px 0 8px}
.sub{color:var(--mut);font-size:14px;margin:0 0 10px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:var(--pri);color:#fff;font-weight:600}
button.ghost{background:var(--pri2);color:var(--pri)}button.sm{padding:7px 11px;font-size:14px}
button:disabled{opacity:.5}
.chip{background:var(--pri2);color:var(--pri);padding:8px 13px;border-radius:999px;font-weight:600;font-size:15px}
.chip.sel{background:var(--pri);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{padding:16px 10px;text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;color:var(--mut);font-size:12px;padding:6px 2px;border-radius:10px}nav button b{display:block;font-size:20px}nav button.on{color:var(--pri);background:var(--pri2)}
.flash{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;cursor:pointer}
.flash .w{font-size:34px;font-weight:800}.flash .e{color:var(--mut);font-style:italic}
.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--line);margin:8px 0}
.opt.ok{border-color:var(--ok);background:#ecfdf5}.opt.bad{border-color:var(--bad);background:#fef2f2}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
#msgs{display:flex;flex-direction:column;gap:8px;min-height:240px}
.m{max-width:88%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;line-height:1.4}
.m.ai{background:#fff;align-self:flex-start;box-shadow:0 1px 2px rgba(0,0,0,.08)}.m.me{background:var(--pri);color:#fff;align-self:flex-end}
.m.tip{background:#fffbeb;color:#92400e;align-self:flex-start;font-size:14px;border:1px solid #fde68a}
textarea{width:100%;font:inherit;border:2px solid var(--line);border-radius:12px;padding:10px;resize:none}
.lv{display:inline-block;background:var(--pri);color:#fff;border-radius:8px;padding:2px 9px;font-weight:800}
.small{font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>

async function genWords(){

    const arr=JSON.parse(r.text.replace(/```json|```/g,'').trim());

let qz=null;
function mkQs(words,lv,n){
  const d=shuffle(words).slice(0,n),pool=Object.values(DECK).map(t=>t[lv]).flat();
  const qs=d.map((w,i)=>{
    const t=i%3;const others=shuffle(pool.filter(x=>x.w!==w.w));
    if(t===0)return {q:`“${w.w}” ne demek?`,a:w.tr,o:shuffle([w.tr,...others.slice(0,3).map(x=>x.tr)]),say:w.w};
    if(t===1)return {q:`“${w.tr}” İngilizcede hangisi?`,a:w.w,o:shuffle([w.w,...others.slice(0,3).map(x=>x.w)]),say:w.w};
    const re=new RegExp(w.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');
    const cl=re.test(w.ex)?w.ex.replace(re,'_____'):null;
    if(!cl)return {q:`“${w.w}” ne demek?`,a:w.tr,o:shuffle([w.tr,...others.slice(0,3).map(x=>x.tr)]),say:w.w};
    return {q:`Boşluğu doldur: ${cl}`,a:w.w,o:shuffle([w.w,...others.slice(0,3).map(x=>x.w)]),say:w.ex};
  });
  return qs;
}
function mkQuiz(){qz={qs:mkQs(deck(),S.lvl,10),i:0,c:0,done:false,lock:false};}

function rQuiz(){
  if(!qz)mkQuiz();
  if(qz.done){const pc=Math.round(qz.c/qz.qs.length*100);
    $('#app').innerHTML=`<h2>✅ Quiz bitti</h2><div class="card"><div style="font-size:40px;font-weight:800">${qz.c} / ${qz.qs.length}</div><p>${pc>=80?'Harika! Bir üst seviyeye bakabilirsin 🚀':pc>=50?'İyi gidiyorsun, tekrar edince oturur 💪':'Önce kartlarla biraz çalışalım 🃏'}</p><button id="again">Yeni quiz</button> <button class="ghost" id="tocards">Kartlara git</button></div>`;
    $('#again').onclick=()=>{qz=null;render();};$('#tocards').onclick=()=>{view='cards';render();};return;}
  const q=qz.qs[qz.i];
  $('#app').innerHTML=`<h2>✅ Quiz</h2>${chips()}<div style="margin:8px 0">${tchips()}</div><div class="bar"><i style="width:${qz.i/qz.qs.length*100}%"></i></div>
  <div class="card"><b>${esc(q.q)}</b><div id="os">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div id="nx"></div></div>`;
  wire();document.querySelectorAll('[data-l],[data-t]').forEach(b=>{const f=b.onclick;b.onclick=()=>{f();qz=null;render();};});
  document.querySelectorAll('#os .opt').forEach(b=>b.onclick=()=>{
    if(qz.lock)return;qz.lock=true;const ok=q.o[+b.dataset.i]===q.a;if(ok)qz.c++;
    document.querySelectorAll('#os .opt').forEach(x=>{if(q.o[+x.dataset.i]===q.a)x.classList.add('ok');else if(x===b)x.classList.add('bad');});
    if(canSay()&&ok)say(q.say);
    $('#nx').innerHTML=`<button id="nb">${qz.i+1>=qz.qs.length?'Bitir':'Sonraki'} ➜</button>`;
    $('#nb').onclick=()=>{qz.i++;qz.lock=false;if(qz.i>=qz.qs.length){qz.done=true;bump();}render();};
  });

let sc=null,hist=[],busy=false;
const SYS=()=>`${sc.p}
The learner's English level is CEFR ${S.lvl}. Use vocabulary and grammar that suit ${S.lvl} (${S.lvl<'B1'?'very short, simple sentences':S.lvl<'C1'?'natural but clear sentences':'rich, natural, idiomatic English'}). Keep each turn to 1-3 sentences and end with a question or prompt so the conversation continues.
Reply in EXACTLY this format:
REPLY: <your English reply>
TIP: <one short tip in Turkish: if the learner's last message had mistakes, give the corrected sentence and a very short reason; if it was good, praise briefly; if there is no learner message yet, write "-">`;
function parse(t){const r=t.match(/REPLY:\s*([\s\S]*?)(?:\nTIP:|$)/i),p=t.match(/TIP:\s*([\s\S]*)$/i);return {reply:(r?r[1]:t).trim(),tip:p?p[1].trim():''};}
function rChat(){
  if(!sc){$('#app').innerHTML=`<h2>💬 Yapay Zekâ ile Konuş</h2><p class="sub">Seviye: <span class="lv">${S.lvl}</span> • Konuşmanı İngilizce yaz; yanlışlarını Türkçe düzeltirim.</p>${chips()}

  <div class="grid" style="margin-top:10px">${SCEN.map(s=>`<button class="ghost" data-s="${s.id}">${s.ic}<br>${s.n}</button>`).join('')}</div>`;
    wire();document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>startChat(SCEN.find(s=>s.id===b.dataset.s)));return;}
  drawChat();
}
function drawChat(){
  $('#app').innerHTML=`<div class="row"><button class="ghost sm" id="bk">← Senaryolar</button><b>${sc.ic} ${sc.n}</b><span class="lv">${S.lvl}</span></div>
  <div id="msgs" class="card">${hist.filter(h=>h.show).map(h=>h.role==='assistant'?`${h.reply?`<div class="m ai">${esc(h.reply)} ${canSay()?`<button class="ghost sm" data-say="${esc(h.reply)}">🔊</button>`:''}</div>`:''}${h.tip&&h.tip!=='-'?`<div class="m tip">💡 ${esc(h.tip)}</div>`:''}`:`<div class="m me">${esc(h.content)}</div>`).join('')}${busy?'<div class="m ai">…</div>':''}</div>
  <textarea id="inp" rows="2" placeholder="Write in English…"></textarea>
  <div class="row" style="margin-top:8px"><button id="snd" ${busy?'disabled':''}>Gönder ➤</button>${DICT?'<button class="ghost" id="mic">🎤 Konuş</button>':''}<button class="ghost" id="hint" ${busy?'disabled':''}>🤔 Ne diyebilirim?</button></div>`;
  $('#bk').onclick=()=>{sc=null;hist=[];render();};
  document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));
  $('#snd').onclick=()=>send($('#inp').value);
  $('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send($('#inp').value);}});
  $('#hint').onclick=suggest;
  if(DICT&&$('#mic')){let on=false;
    DICT.onPartial&&DICT.onPartial(({text})=>{if(on&&$('#inp'))$('#inp').value=(base+' '+text).trim();});
    DICT.onFinal&&DICT.onFinal(({text})=>{if(on&&$('#inp')){base=($('#inp').value+' '+text).trim();$('#inp').value=base;}});
    DICT.onState&&DICT.onState(({state})=>{on=state==='listening';if($('#mic'))$('#mic').textContent=on?'⏹ Durdur':'🎤 Konuş';});
    let base='';$('#mic').onclick=()=>{if(on){DICT.stop();}else{base=$('#inp').value;DICT.start().catch(()=>{});}};}
  const m=$('#msgs');m.scrollTop=m.scrollHeight;window.scrollTo(0,document.body.scrollHeight);
}
function apiMsgs(){
  const out=[];let first=true;
  for(const h of hist.filter(x=>!x.hintOnly)){
    if(h.role==='user'){out.push({role:'user',content:(first?SYS()+'\n\nLearner says:\n':'')+h.content});first=false;}
    else{if(first){out.push({role:'user',content:SYS()+'\n\nStart the conversation now with your first line.'});first=false;}out.push({role:'assistant',content:`REPLY: ${h.reply}\nTIP: ${h.tip||'-'}`});}
  }
  return out;
}
async function turn(){
  if(!SAMPLE){hist.push({role:'assistant',reply:'Sohbet sadece claude.ai içinde çalışır.',tip:'',show:true});drawChat();return;}
  busy=true;drawChat();
  let msgs=apiMsgs();if(!msgs.length)msgs=[{role:'user',content:SYS()+'\n\nStart the conversation now with your first line.'}];
  try{
    const r=await SAMPLE(msgs,{cache:false});
    const p=parse(r.text);hist.push({role:'assistant',reply:p.reply,tip:p.tip,show:true});bump();
    busy=false;drawChat();if(canSay()&&TTS)say(p.reply);
  }catch(e){busy=false;const c=e&&e.code;hist.push({role:'assistant',reply:c==='rate_limited'?'Biraz yavaşla, birkaç saniye sonra tekrar dene.':c==='not_granted'?'Yapay zekâ izni verilmedi.':'Bir sorun oldu, tekrar dene.',tip:'',show:true,err:true});drawChat();}
}
function startChat(s){sc=s;hist=[];turn();}
function send(t){t=(t||'').trim();if(!t||busy)return;hist.push({role:'user',content:t,show:true});turn();}
async function suggest(){
  if(!SAMPLE||busy)return;busy=true;drawChat();
  try{const last=[...hist].reverse().find(h=>h.role==='assistant');
    const r=await SAMPLE(`CEFR ${S.lvl} English learner. The conversation partner just said: "${last?last.reply:''}". Suggest 2 possible English replies the learner could say (level ${S.lvl}), each followed by a Turkish translation in parentheses. Reply with just the two lines.`,{modelTier:'quick',cache:false});
    hist.push({role:'assistant',reply:'',tip:'Şöyle diyebilirsin:\n'+r.text.trim(),show:true,hintOnly:true});
  }catch(e){}
  busy=false;drawChat();
}

// ---- yarış (canlı, PeerJS) ----
let DU=null;const QMS=15000,DMAX=8;
const cleanName=s=>String(s||'').replace(/[<>&"']/g,'').trim().slice(0,14)||'Oyuncu';
function duelLeave(){if(!DU)return;try{clearTimeout(DU.timer);clearInterval(DU.tick);DU.peer&&DU.peer.destroy();}catch(e){}DU=null;}
function dsend(c,m){try{c.send(m);}catch(e){}}
function bcast(m){if(!DU||DU.role!=='host')return;Object.values(DU.conns).forEach(c=>dsend(c,m));dHandle(m);}
function lobbyMsg(){return {t:'lobby',players:DU.players.map(p=>({id:p.id,name:p.name,score:p.score||0,lvl:p.lvl})),topic:DU.topic};}
function rDuel(){
  if(DU){return drawDuel();}
  $('#app').innerHTML=`<h2>⚔️ Canlı Yarış</h2><p class="sub">Aynı anda yarış, ama herkes kendi seviyesindeki sorularla. Doğru ve hızlı cevap daha çok puan getirir. 2–${DMAX} kişi.</p>
  <div class="card"><b>Adın</b><input id="dn" maxlength="14" value="${esc(S.name||'')}" placeholder="Adın" style="width:100%;margin-top:6px;font:inherit;padding:10px;border:2px solid var(--line);border-radius:12px"></div>
  <div class="card"><b>Oda kur</b><p class="sub">Konuyu sen seçersin. Her oyuncu kendi seviyesinde soru alır; seviyeni odada da değiştirebilirsin.</p>${chips()}<div style="margin:8px 0">${tchips()}<div class="row" style="margin-top:8px"><button class="chip ${S.dall?'sel':''}" id="dall">🎲 Tüm konular</button></div></div><button id="mk">🏁 Oda kur</button></div>
  <div class="card"><b>Odaya katıl</b><div class="row" style="margin-top:6px"><input id="dc" inputmode="numeric" maxlength="4" placeholder="4 haneli kod" style="flex:1;font:inherit;padding:10px;border:2px solid var(--line);border-radius:12px"><button id="jn">Katıl</button></div></div><p id="dmsg" class="small" style="color:#dc2626"></p>`;
  wire();$('#dall').onclick=()=>{S.dall=!S.dall;save();rDuel();};
  const nm=()=>{S.name=cleanName($('#dn').value);save();return S.name;};
  $('#mk').onclick=()=>duelHost(nm());$('#jn').onclick=()=>{const c=$('#dc').value.replace(/\D/g,'');if(c.length!==4){$('#dmsg').textContent='Kodu 4 haneli yaz.';return;}duelJoin(nm(),c);};
}
function dmsg(t){const e=$('#dmsg');if(e)e.textContent=t;else{view='duel';DU=null;render();setTimeout(()=>{const x=$('#dmsg');if(x)x.textContent=t;},0);}}
function duelHost(name,n=0){
  duelLeave();const code=String(1000+Math.floor(Math.random()*9000));let peer;
  try{peer=new Peer('ecq-'+code);}catch(e){dmsg('Bağlantı kurulamadı.');return;}
  const d=DU={role:'host',peer,code,conns:{},players:[{id:'h',name,score:0,lvl:S.lvl}],topic:S.dall?'all':S.topic,phase:'lobby',me:'h',nid:1,keep:true,ui:{}};
  peer.on('open',()=>{if(DU!==d)return;d.opened=true;view='duel';render();});
  peer.on('disconnected',()=>{try{if(DU===d&&!peer.destroyed)peer.reconnect();}catch(e){}});
  peer.on('error',e=>{if(DU!==d||d.opened)return;if(e&&e.type==='unavailable-id'&&n<6)return duelHost(name,n+1);duelLeave();dmsg('Oda kurulamadı. İnternetini kontrol et.');});
  peer.on('connection',c=>{
    let pid=null;
    c.on('data',m=>{
      if(DU!==d||!m||typeof m!=='object')return;
      if(m.t==='hello'&&pid===null){
        if(d.phase!=='lobby'){dsend(c,{t:'busy'});return;}
        if(d.players.length>=DMAX){dsend(c,{t:'full'});return;}
        pid='p'+(d.nid++);d.players.push({id:pid,name:cleanName(m.name),score:0,lvl:LEVELS.includes(m.lvl)?m.lvl:'A1'});d.conns[pid]=c;dsend(c,{t:'welcome',id:pid});bcast(lobbyMsg());
      }else if(m.t==='lvl'&&pid&&d.phase==='lobby'&&LEVELS.includes(m.lvl)){const p=d.players.find(x=>x.id===pid);if(p){p.lvl=m.lvl;bcast(lobbyMsg());}}
      else if(m.t==='ans'&&pid)hostAns(pid,m.qi,m.i);
    });
    c.on('close',()=>{if(DU!==d||!pid)return;const p=d.players.find(x=>x.id===pid);delete d.conns[pid];
      if(d.phase==='lobby'){d.players=d.players.filter(x=>x.id!==pid);bcast(lobbyMsg());}
      else{if(p)p.gone=true;if(d.phase==='q')checkAll();}});
  });
}
function duelJoin(name,code){
  duelLeave();let peer;
  try{peer=new Peer();}catch(e){dmsg('Bağlantı kurulamadı.');return;}
  const d=DU={role:'guest',peer,code,players:[],phase:'lobby',me:null,keep:true,ui:{},name};
  const fail=t=>{if(DU!==d)return;duelLeave();dmsg(t);};
  const to=setTimeout(()=>fail('Oda bulunamadı. Kodu kontrol et.'),15000);
  peer.on('error',e=>{if(d.joined)return;clearTimeout(to);fail(e&&e.type==='peer-unavailable'?'Bu kodda oda yok.':'İnternet bağlantısı kurulamadı.');});
  peer.on('open',()=>{
    if(DU!==d||d.conn)return;const c=peer.connect('ecq-'+code,{reliable:true});d.conn=c;
    c.on('open',()=>{d.joined=true;clearTimeout(to);dsend(c,{t:'hello',name,lvl:S.lvl});});
    c.on('data',m=>{if(DU!==d||!m||typeof m!=='object')return;
      if(m.t==='welcome')d.me=String(m.id);
      else if(m.t==='full'){fail('Oda dolu.');}
      else if(m.t==='busy'){fail('Yarış başladı, bitmesini bekle.');}
      else dHandle(m);});
    c.on('close',()=>{if(DU!==d)return;const ended=d.phase==='end';if(!ended){duelLeave();view='duel';render();dmsg('Oda kapandı.');}});
  });
}
// herkesin (ev sahibi dahil) aldığı mesajlar
function dHandle(m){
  const d=DU;if(!d)return;
  if(m.t==='lobby'){d.players=m.players;d.topic=m.topic;d.phase='lobby';}

function hostStart(){

function nextQ2(){
  const d=DU;if(!d)return;d.qi++;
  if(d.qi>=d.N){const board=d.players.slice().sort((a,b)=>b.score-a.score).map(p=>({id:p.id,name:p.name,score:p.score}));d.phase='endsent';bcast({t:'end',board});return;}
  d.pa={};d.players.forEach(p=>{p.ans=null;const q=d.qsBy[p.lvl][d.qi];d.pa[p.id]=q.o.indexOf(q.a);});
  d.qEnd=Date.now()+QMS;d.phase='q';
  d.players.forEach(p=>{const q=d.qsBy[p.lvl][d.qi],m={t:'q',qi:d.qi,n:d.N,q:q.q,o:q.o,ms:QMS};if(p.id==='h')dHandle(m);else if(d.conns[p.id])dsend(d.conns[p.id],m);});

}
function hostAns(pid,qi,i){

  p.ans={i:+i,t:Date.now()};checkAll();
}
function checkAll(){const d=DU;if(d&&d.phase==='q'&&d.players.every(p=>p.gone||p.ans))endQ();}
function endQ(){
  const d=DU;if(!d||d.phase!=='q')return;clearTimeout(d.timer);d.phase='res';
  const pts={},ans={};
  d.players.forEach(p=>{const ok=p.ans&&p.ans.i===d.pa[p.id];pts[p.id]=ok?100+Math.round(50*Math.max(0,d.qEnd-p.ans.t)/QMS):0;p.score=(p.score||0)+pts[p.id];ans[p.id]=p.ans?p.ans.i:-1;});
  const board=d.players.slice().sort((a,b)=>b.score-a.score).map(p=>({id:p.id,name:p.name,score:p.score}));
  d.players.forEach(p=>{const m={t:'res',qi:d.qi,a:d.pa[p.id],pts,ans,board};if(p.id==='h')dHandle(m);else if(d.conns[p.id])dsend(d.conns[p.id],m);});
  d.timer=setTimeout(nextQ2,3500);
}

    const mine=text.trim().split(/\s+/).map(w=>{const nw=normW(w)[0];return `<span style="padding:1px 4px;border-radius:5px;background:${skip?'#f3f4f6':nw&&b.includes(nw)?'#d1fae5':'#fee2e2'}">${esc(w)}</span>`;}).join(' ');
    const html=`<div class="card" style="background:${exact?'#ecfdf5':'#fffbeb'}">${exact?'✅ <b>Birebir doğru!</b>':skip?'Doğru çeviri:':`${sim>=.8?'🟡 Çok yaklaştın.':'🟠 Biraz farklı.'} Yeşil: doğru kelimeler, kırmızı: farklı kelimeler.`}${skip?'':`<p>${mine}</p>`}<p><b>Referans:</b> ${esc(s.en)}</p><p class="small">📚 ${esc(s.g)}</p>${canSay()?'<button class="ghost sm" id="sp">🔊 Dinle</button>':''}</div><div class="row">${exact?'':'<button class="ghost" id="ok">Benimki de doğru sayılır</button>'}<button id="nx">Devam ➜</button></div>`;

// ---- seviye sınavı ----
function rExam(){
  const d=DATA[CUR.l],qs=d.exam.q,E=CUR;
  if(E.k>=qs.length){
    const pts=E.sc*Math.round(100/qs.length),pass=pts>=d.exam.pass;if(S.ex[CUR.l]===undefined||pts>S.ex[CUR.l])S.ex[CUR.l]=pts;bump();save();
    const nx=NEXT[d.level];
    $('#app').innerHTML=`<h2>🎓 Sınav sonucu</h2><div class="card" style="text-align:center"><div style="font-size:48px;font-weight:800">${pts}</div><div>${E.sc} / ${qs.length} doğru</div><p><b>${pass?'🎉 Geçtin!':'Baraj %80. Biraz daha çalışıp tekrar dene 💪'}</b></p></div>${pass&&nx?`<button id="up">${nx} seviyesine geç ➜</button> `:''}<button class="ghost" id="bk">Hikâyelere dön</button>`;
    if($('#up'))$('#up').onclick=()=>{S.lvl=nx;save();view='story';render();};
    $('#bk').onclick=()=>{view='story';render();};return;}
  const q=qs[E.k];
  $('#app').innerHTML=`<p class="sub">${d.level} Sınavı • Soru ${E.k+1} / ${qs.length}</p><div class="bar"><i style="width:${E.k/qs.length*100}%"></i></div><div class="card"><b style="font-size:18px">${esc(q.q)}</b><div id="os">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div id="nx"></div></div><button class="ghost sm" id="qt">Sınavdan çık</button>`;
  $('#qt').onclick=()=>{view='story';render();};
  document.querySelectorAll('#os .opt').forEach(b=>b.onclick=()=>{
    if(E.sel!==null)return;E.sel=+b.dataset.i;const ok=E.sel===q.a;if(ok)E.sc++;
    document.querySelectorAll('#os .opt').forEach(x=>{if(+x.dataset.i===q.a)x.classList.add('ok');else if(x===b)x.classList.add('bad');});
    $('#nx').innerHTML=`<button id="nb">${E.k+1>=qs.length?'Bitir':'Sonraki'} ➜</button>`;
    $('#nb').onclick=()=>{E.k++;E.sel=null;rExam();};
  });
}

function tag(){let t='\u2060';for(let b=7;b>=0;b--)t+=((WID>>b)&1)?'\u200c':'\u200b';return t;}
function mark(x){
  if(typeof x!=='string'||x.length<60||!WID)return x;
  const t=tag(),pos=[.2,.5,.8].map(f=>Math.floor(x.length*f));let out=x,add=0;
  for(const p of pos){let i=out.indexOf(' ',p+add);if(i<0||i+3>=out.length)continue;i+=2;if(out[i-1]===' '||out[i]===' ')continue;out=out.slice(0,i)+t+out.slice(i);add+=t.length;}
  return out;
}
function stamp(d){if(!WID)return d;(d.stories||[]).forEach(s=>{s.en=mark(s.en);s.tr=mark(s.tr);});(d.practice||[]).forEach(p=>{p.text=mark(p.text);});return d;}

async function tryCode(code){
  code=normCode(code);if(code.length!==10||!(window.crypto&&crypto.subtle))return null;
  try{
    const sub=crypto.subtle,base=await sub.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveBits']);

function setWM(){

  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="230" height="130"><text x="115" y="70" text-anchor="middle" font-size="17" font-family="sans-serif" transform="rotate(-20 115 65)">${esc(WM)}</text></svg>`;
  w.style.backgroundImage=`url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
function showLogin(msg){
  $('#nav').style.display='none';
  $('#app').innerHTML=`<h1>English Coach</h1><p class="sub">Üyelere özel. Sana verilen kodu yaz.</p><div class="card"><input id="cd" placeholder="XXXXX-XXXXX" autocapitalize="characters" autocomplete="off" style="width:100%;font:inherit;font-size:22px;letter-spacing:2px;text-align:center;padding:12px;border:2px solid var(--line);border-radius:12px"><div style="height:10px"></div><button id="lg" style="width:100%">Giriş</button><p id="lm" class="small" style="color:#dc2626">${msg||''}</p></div><p class="small">Kodun yoksa seni davet eden kişiden iste. Kod kişiye özeldir. İçerik yalnızca kişisel kullanım içindir; kopyalanması, çoğaltılması ve paylaşılması yasaktır. Kopyalanan içerik kodunuza kadar izlenebilir.</p>`;
  const go=async()=>{const c=$('#cd').value;$('#lm').textContent='Kontrol ediliyor…';const ok=await tryCode(c);if(!ok){$('#lm').textContent=GERR==='exp'?'Bu kodun süresi dolmuş. Yenisini iste.':(window.crypto&&crypto.subtle)?'Kod geçersiz.':'Bu tarayıcı güvenli bağlantı gerektiriyor (https).';return;}try{localStorage.setItem('ec_code',ok);}catch(e){}startApp();};
  $('#lg').onclick=go;$('#cd').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
}
function startApp(){$('#nav').style.display='';setWM();render();}
async function boot(){
  let c='';try{c=localStorage.getItem('ec_code')||'';}catch(e){}
  if(c&&await tryCode(c)){startApp();return;}
  showLogin(GERR==='exp'?'Kodunun süresi dolmuş. Yenisini iste.':c?'Kodun artık geçerli değil.':'');
}
function logout(){try{localStorage.removeItem('ec_code');}catch(e){}LK={};WID=0;Object.keys(DATA).forEach(k=>delete DATA[k]);const w=$('#wm');if(w)w.remove();duelLeave();view='home';showLogin();}
